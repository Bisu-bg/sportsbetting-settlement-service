services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  nameserver:
    image: sportsbetting-rocketmq:5.5.1
    build:
      context: .
      dockerfile: docker/Dockerfile.rocketmq
    command: mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m
    ports:
      - "127.0.0.1:9876:9876"
  rocketmq:
    image: sportsbetting-rocketmq:5.5.1
    build:
      context: .
      dockerfile: docker/Dockerfile.rocketmq
    depends_on:
      - nameserver
    ports:
      - "127.0.0.1:10911:10911"
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
      BROKER_HOST: rocketmq
    volumes:
      - ./docker/broker.conf:/opt/rocketmq/broker-base.conf:ro
    command:
      - sh
      - -c
      - |
        cp /opt/rocketmq/broker-base.conf /tmp/broker.conf
        echo "brokerIP1=$${BROKER_HOST}" >> /tmp/broker.conf
        exec mqbroker -n nameserver:9876 -c /tmp/broker.conf
    healthcheck:
      test: ["CMD-SHELL", "mqadmin clusterList -n nameserver:9876 | grep -q broker-a"]
      interval: 10s
      timeout: 10s
      retries: 20
  rocketmq-init:
    image: sportsbetting-rocketmq:5.5.1
    build:
      context: .
      dockerfile: docker/Dockerfile.rocketmq
    depends_on:
      rocketmq:
        condition: service_healthy
    environment:
      JAVA_OPT_EXT: -Xms64m -Xmx128m
    command: mqadmin updateTopic -n nameserver:9876 -b rocketmq:10911 -t bet-settlements -r 4 -w 4
  app:
    image: sportsbetting-settlement-service:local
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ROCKETMQ_NAMESERVER: nameserver:9876
    depends_on:
      kafka:
        condition: service_healthy
      rocketmq-init:
        condition: service_completed_successfully
