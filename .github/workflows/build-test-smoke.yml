name: Build, test and smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Build, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: chmod +x gradlew && ./gradlew --no-daemon clean check bootJar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-and-jacoco
          path: |
            build/reports/tests/test
            build/reports/tests/integrationTest
            build/reports/jacoco/test
  broker-smoke:
    name: Bet settlement, duplicate handling and broker recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose up --build -d
      - shell: pwsh
        run: ./scripts/smoke.ps1 -TestOutage
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
